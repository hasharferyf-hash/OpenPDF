name: CI

on:
  pull_request:
    branches: [main, chore/project-foundation]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-build:
    name: Windows checks and build
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
      - name: Install frontend dependencies
        run: npm install
      - name: Type-check
        run: npm run check
      - name: Build frontend
        run: npm run build
      - name: Test native code
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Build Windows installers
        run: npm run tauri build
      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OpenPDF-Windows-installers
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error

      # Every successful push to main gets its own rolling-development snapshot release.
      # Stable, numbered releases remain a separate, deliberate release process.
      - name: Publish main build as a prerelease
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: main-build-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: OpenPDF main build #${{ github.run_number }}
          prerelease: true
          make_latest: false
          generate_release_notes: true
          overwrite_files: true
          fail_on_unmatched_files: true
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
